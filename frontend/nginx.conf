server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой путь, не найденный в статике, отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты (имена с хэшем) — кэш надолго и иммутабельны
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html НИКОГДА не кэшируем — иначе юзер залипает на старой версии
    # и ссылается на удалённые хэши ассетов.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;
    }
}
